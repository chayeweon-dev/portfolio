<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 경험</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --sea: #ffffff;
    --land: #d9dfeb;
    --land-edge: #bcc6da;
    --grid: #eef0f5;
    --ink: #1a2238;
    --muted: #5a6275;
    --card: #ffffff;
    --line: #cdd3e0;
    --accent: #1b2f6e;
    --sans: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--sea);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    word-break: keep-all;
    /* 화면 한 페이지에 맞춤: 남는 높이를 지도가 채움 */
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100vh;
    height: 100svh;
  }
  .wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  header.wrap { flex: none; padding: clamp(12px, 3vh, 40px) 24px clamp(4px, 1vh, 16px); text-align: center; }
  h1 {
    margin: 0;
    font-family: var(--sans);
    font-size: clamp(1.75rem, 5vh, 3.25rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .tagline { margin: 2px 0 0; color: var(--muted); font-size: clamp(1rem, 2vh, 1.2rem); }

  .map-slot {
    flex: 1 1 0;
    min-height: 180px;
    max-height: calc(100vw / 2.483);
    container-type: size;
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }
  /* 2.483 = 지도의 가로세로 비율 (1000 / 402.8) */
  .map { position: relative; flex: none; width: min(100cqw, 100cqh * 2.483); line-height: 0; }
  .map svg {
    display: block;
    width: 100%;
    height: auto;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
    mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
  }
  .graticule { fill: none; stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .land { fill: var(--land); stroke: var(--land-edge); stroke-width: 0.6; vector-effect: non-scaling-stroke; }
  .route {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-dasharray: 6 5;
    opacity: 0.55;
    vector-effect: non-scaling-stroke;
  }

  .heads { fill: var(--accent); opacity: 0.55; }

  .pin {
    position: absolute;
    width: 0;
    height: 0;
    line-height: 1.2;
  }
  .pin .label {
    position: absolute;
    left: 0;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 0.8125rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .pin.region .dot { display: none; }
  .pin.region .label {
    transform: translate(-50%, -50%);
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent);
    transition: background 0.15s, color 0.15s, transform 0.15s;
  }
  .pin.region.active { z-index: 3; }
  .pin.region.active .label {
    background: var(--accent);
    color: #fff;
    transform: translate(-50%, -50%) scale(1.2);
  }
  .pin.origin { z-index: 2; }
  .pin.origin .dot {
    position: absolute;
    left: -7px;
    top: -7px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--card);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .pin.origin .label {
    bottom: 12px;
    transform: translateX(-50%);
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent);
    transition: background 0.15s, color 0.15s, transform 0.15s;
  }
  .pin.origin.active { z-index: 3; }
  .pin.origin.active .label {
    background: var(--accent);
    color: #fff;
    transform: translateX(-50%) scale(1.2);
  }

  .cards {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin: -4vh 0 0;
    padding: 0;
    list-style: none;
  }
  main.wrap { flex: none; }
  .card {
    padding: clamp(10px, 1.8vh, 20px) 22px clamp(10px, 1.8vh, 22px);
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 4px solid var(--accent);
    border-radius: 3px;
    }
  .card .place { margin: 0; color: var(--accent); font-size: 0.875rem; font-weight: 600; }
  .card h2 { margin: 4px 0 2px; font-family: var(--sans); font-size: 1.3rem; line-height: 1.35; }
  .card .period { margin: 0 0 10px; color: var(--muted); font-size: 0.875rem; }
  .card .desc { margin: 0; font-size: 0.975rem; white-space: pre-line; }

  footer.wrap { flex: none; padding: clamp(8px, 2vh, 28px) 24px clamp(10px, 2.5vh, 32px); text-align: center; }
  footer h2 { margin: 0 0 clamp(2px, 0.6vh, 10px); font-family: var(--sans); font-size: 1.15rem; }
  .contacts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 28px; margin: 0; padding: 0; list-style: none; }
  .contacts a { color: var(--ink); font-weight: 600; text-underline-offset: 3px; }
  .contacts a:hover { color: var(--accent); }
  .contacts span { margin-right: 6px; color: var(--muted); font-size: 0.875rem; }

  @media (max-width: 800px) {
    body { height: auto; }
    .map-slot { flex: none; min-height: 0; max-height: none; container-type: normal; }
    .map { width: 100%; }
    .map svg { -webkit-mask-image: none; mask-image: none; }
    .cards { grid-template-columns: 1fr; margin-top: 16px; }
    .pin .label { font-size: 0.6875rem; padding: 1px 5px; }
    .pin.origin .label { bottom: 9px; }
    .pin.origin .dot { left: -5px; top: -5px; width: 10px; height: 10px; }
  }
</style>
</head>

      // 항상 위쪽으로 휘도록 수직 방향을 고름
      const flip = dx > 0 ? 1 : -1;
      const cx = (x1 + x2) / 2 + dy * a.bend * flip;
      const cy = (y1 + y2) / 2 - dx * a.bend * flip;
      const len = Math.hypot(x2 - cx, y2 - cy);
      const ux = (x2 - cx) / len, uy = (y2 - cy) / len;
      // 선은 화살촉 안쪽에서 끝나게 해 끝이 뾰족하게 보이도록 함
      lines += `M${x1} ${y1}Q${cx} ${cy} ${x2 - ux * head * 0.8} ${y2 - uy * head * 0.8}`;
      const bx = x2 - ux * head, by = y2 - uy * head, w = head * 0.45;
      heads += `M${x2} ${y2}L${bx - uy * w} ${by + ux * w}L${bx + uy * w} ${by - ux * w}Z`;
    });
    document.getElementById("route").setAttribute("d", lines);
    document.getElementById("heads").setAttribute("d", heads);
  }
  drawArrows();
  window.addEventListener("resize", drawArrows);

  function addLabel(place, className) {
    const pin = document.createElement("div");
    pin.className = "pin " + className;
    pin.style.left = toX(place.lon) / W * 100 + "%";
    pin.style.top = toY(place.lat) / H * 100 + "%";
    pin.innerHTML = '<span class="dot"></span><span class="label"></span>';
    pin.querySelector(".label").textContent = place.label;
    map.appendChild(pin);
    return pin;
  }
  const regionPins = {};
  PROFILE.regions.forEach(r => { regionPins[r.label] = addLabel(r, "region"); });
  regionPins[PROFILE.origin.label] = addLabel(PROFILE.origin, "origin");

  const cards = document.getElementById("cards");
  PROFILE.experiences.forEach(e => {
    const card = document.createElement("li");
    card.className = "card";
    card.innerHTML = '<p class="place"></p><h2></h2><p class="period"></p><p class="desc"></p>';
    card.querySelector(".place").textContent = e.place;
    card.querySelector("h2").textContent = e.title;
    card.querySelector(".period").textContent = e.period;
    card.querySelector(".desc").textContent = e.desc;
    cards.appendChild(card);

    const regionPin = regionPins[e.region];
    if (regionPin) {
      card.addEventListener("mouseenter", () => regionPin.classList.add("active"));
      card.addEventListener("mouseleave", () => regionPin.classList.remove("active"));
    }
  });

  const contacts = document.getElementById("contacts");
  PROFILE.contacts.forEach(c => {
    const li = document.createElement("li");
    li.innerHTML = "<span></span><a></a>";
    li.querySelector("span").textContent = c.label;
    li.querySelector("a").textContent = c.text;
    li.querySelector("a").href = c.href;
    contacts.appendChild(li);
  });
</script>
</body>
